{% extends 'base.html' %}
{% block title %}New purchase order{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">PROCUREMENT / DRAFT</p><h1>New purchase order</h1><p class="muted-copy">The order is pending until approved. Inventory updates on receipt.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('purchases.index') }}"><i class="bi bi-arrow-left me-2"></i>Back</a></div>
<section class="panel form-panel"><form data-order-form data-kind="purchase" data-endpoint="{{ url_for('purchases.api_orders') }}" data-success-url="{{ url_for('purchases.index') }}" data-csrf="{{ csrf_token() }}">
  <div class="row g-3"><div class="col-md-6"><label class="form-label" for="supplier_id">Supplier</label><select class="form-select" name="supplier_id" id="supplier_id" required>{% for supplier in suppliers %}<option value="{{ supplier.id }}">{{ supplier.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="warehouse_id">Destination warehouse</label><select class="form-select" name="warehouse_id" id="warehouse_id" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div></div>
  <div class="line-items-head"><h2>Items</h2><button type="button" class="btn btn-sm btn-outline-secondary" data-add-line><i class="bi bi-plus-lg me-1"></i>Add item</button></div><div class="order-lines" data-order-lines></div><div class="order-total"><span>Estimated total</span><strong data-order-total>₹0.00</strong></div>
  <div class="mt-3"><label class="form-label" for="notes">Notes</label><textarea class="form-control" name="notes" id="notes" rows="2" maxlength="1000"></textarea></div><div class="form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('purchases.index') }}">Cancel</a><button class="btn btn-primary" type="submit">Create pending order</button></div><div class="form-feedback" aria-live="polite"></div>
</form><script type="application/json" data-product-data>{{ products|map(attribute='id')|list|tojson }}</script><div class="d-none" data-product-options>{% for p in products %}<span data-id="{{ p.id }}" data-sku="{{ p.sku }}" data-name="{{ p.name }}" data-cost="{{ p.cost_price }}"></span>{% endfor %}</div></section>{% endblock %}
