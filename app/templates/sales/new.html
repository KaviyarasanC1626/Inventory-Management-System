{% extends 'base.html' %}
{% block title %}New sale{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">CHECKOUT / DRAFT</p><h1>New sales order</h1><p class="muted-copy">Review line items before completing the order.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('sales.index') }}"><i class="bi bi-arrow-left me-2"></i>Back</a></div>
<section class="panel form-panel"><form data-order-form data-kind="sale" data-endpoint="{{ url_for('sales.api_orders') }}" data-success-url="{{ url_for('sales.index') }}" data-csrf="{{ csrf_token() }}">
  <div class="row g-3"><div class="col-md-4"><label class="form-label" for="warehouse_id">Warehouse</label><select class="form-select" name="warehouse_id" id="warehouse_id" required>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label" for="customer_name">Customer</label><input class="form-control" name="customer_name" id="customer_name" maxlength="180" placeholder="Walk-in customer"></div><div class="col-md-2"><label class="form-label" for="discount_amount">Discount (₹)</label><input class="form-control" name="discount_amount" id="discount_amount" type="number" min="0" step="0.01" value="0"></div><div class="col-md-2"><label class="form-label" for="tax_rate">Tax (%)</label><input class="form-control" name="tax_rate" id="tax_rate" type="number" min="0" max="100" step="0.01" value="0"></div></div>
  <div class="line-items-head"><h2>Items</h2><button type="button" class="btn btn-sm btn-outline-secondary" data-add-line><i class="bi bi-plus-lg me-1"></i>Add item</button></div><div class="order-lines" data-order-lines></div><div class="order-total"><span>Estimated total (before order discount)</span><strong data-order-total>₹0.00</strong></div>
  <div class="mt-3"><label class="form-label" for="notes">Notes</label><textarea class="form-control" name="notes" id="notes" rows="2" maxlength="1000"></textarea></div><div class="form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('sales.index') }}">Cancel</a><button class="btn btn-primary" type="submit">Create pending sale</button></div><div class="form-feedback" aria-live="polite"></div>
</form><div class="d-none" data-product-options>{% for p in products %}<span data-id="{{ p.id }}" data-sku="{{ p.sku }}" data-name="{{ p.name }}" data-price="{{ p.selling_price }}"></span>{% endfor %}</div></section>{% endblock %}
