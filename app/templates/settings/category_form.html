{% extends 'base.html' %}
{% block title %}Edit category{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION / CATEGORIES</p><h1>Edit category</h1><p class="muted-copy">Changes apply to the catalog; historical orders are retained.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('settings.categories') }}"><i class="bi bi-arrow-left me-2"></i>Back to categories</a></div>
<section class="panel form-panel"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-12"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="100" required value="{{ category.name }}"></div>
  <div class="col-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="3">{{ category.description or '' }}</textarea></div>
  <div class="col-12 form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('settings.categories') }}">Cancel</a><button class="btn btn-primary">Save category</button></div>
</form></section>
{% endblock %}
