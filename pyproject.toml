
[project]
name = "inventory-management-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6.3,<1.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "PyMySQL>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "waitress>=3.0,<4.0",
    "pytest>=8.0,<9.0",
]

[tool.vercel]
entrypoint = "run:app"
